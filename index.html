<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tibia Soundboard - 815 Sons</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236366f1'/%3E%3Cpath d='M8 12h4l5-5v18l-5-5H8zm13.5 2.5A5 5 0 0122 20a5 5 0 010-5.5' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M25 8a10 10 0 010 16' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236366f1'/%3E%3Cpath d='M10 20v-8h3v8zm5 3V9h3v14zm5-6v-2h3v2z' fill='white'/%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236366f1'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'%3E🔊%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

:root {
  --bg: #f4f2ee;
  --bg2: #ffffff;
  --bg3: #eae8e3;
  --border: #d4d0c8;
  --border-hover: #a09888;
  --accent: #6366f1;
  --accent-light: #818cf8;
  --accent-bg: rgba(99,102,241,0.08);
  --text: #1a1a2e;
  --text-dim: #6b6580;
  --text-muted: #9a94a8;
  --shadow: rgba(0,0,0,0.06);
  --shadow-hover: rgba(0,0,0,0.1);
  --radius: 14px;
  --playing: #6366f1;
}

[data-theme="dark"] {
  --bg: #0c0a14;
  --bg2: #151220;
  --bg3: #1e1a2e;
  --border: #2a2640;
  --border-hover: #4a4580;
  --accent: #818cf8;
  --accent-light: #a5b4fc;
  --accent-bg: rgba(129,140,248,0.1);
  --text: #e8e4f0;
  --text-dim: #9892b0;
  --text-muted: #6a6580;
  --shadow: rgba(0,0,0,0.3);
  --shadow-hover: rgba(0,0,0,0.5);
  --playing: #818cf8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* HEADER */
header {
  background: var(--bg2);
  padding: 20px 16px 14px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

header h1 {
  font-size: 1.3em;
  color: var(--text);
  font-weight: 700;
  letter-spacing: -0.5px;
}
header h1 span { color: var(--accent); }
header p { color: var(--text-dim); font-size: 0.75em; }

/* THEME TOGGLE & AUTH */
.top-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.theme-toggle {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px;
  display: flex;
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}
.theme-toggle span {
  padding: 4px 10px;
  border-radius: 16px;
  font-size: 0.75em;
  color: var(--text-dim);
  transition: all 0.25s;
}
.theme-toggle span.active {
  background: var(--accent);
  color: #fff;
}
.auth-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-size: 0.78em;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  flex-shrink: 0;
}
.auth-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
.auth-btn img {
  width: 22px;
  height: 22px;
  border-radius: 50%;
}
.auth-btn .fa-google { color: #ea4335; }

/* SEARCH */
.search-bar {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.search-bar input {
  flex: 1;
  min-width: 150px;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg3);
  color: var(--text);
  font-size: 0.85em;
  outline: none;
  transition: all 0.3s;
}
.search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.search-bar input::placeholder { color: var(--text-muted); }
.search-bar select {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg3);
  color: var(--text);
  font-size: 0.8em;
  outline: none;
  cursor: pointer;
  transition: border-color 0.3s;
}
.search-bar select:focus { border-color: var(--accent); }

.stats {
  margin-top: 8px;
  font-size: 0.7em;
  color: var(--text-muted);
}

/* MAIN */
main {
  max-width: 1600px;
  margin: 0 auto;
  padding: 16px;
  padding-bottom: 80px;
}

/* GRID */
.sound-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 900px) { .sound-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
@media (max-width: 600px) { .sound-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
@media (max-width: 400px) { .sound-grid { grid-template-columns: 1fr; gap: 8px; } }

/* CARDS */
.sound-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  position: relative;
  user-select: none;
  box-shadow: 0 1px 3px var(--shadow);
}
.sound-btn:hover {
  border-color: var(--border-hover);
  box-shadow: 0 4px 16px var(--shadow-hover);
  transform: translateY(-1px);
}
.sound-btn.playing {
  border-color: var(--playing);
  box-shadow: 0 0 0 2px var(--accent-bg);
  background: var(--accent-bg);
}
.sound-btn .card-body {
  display: flex;
  gap: 14px;
  align-items: center;
}
.sound-btn .card-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}
.sound-btn .card-img {
  flex-shrink: 0;
  width: 80px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  cursor: pointer;
}
.sound-btn .card-img:hover {
  border-color: var(--accent);
}
.sound-btn .card-img-empty {
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 2px;
}
.sound-btn .card-img-empty::after {
  content: 'ADD\A imagem';
  white-space: pre;
  font-family: 'Outfit', sans-serif;
  font-size: 0.55em;
  font-weight: 600;
  color: var(--text-muted);
  opacity: 0.6;
  text-align: center;
  line-height: 1.2;
}
.sound-btn .card-img-empty::before {
  content: '\f067';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  font-size: 1em;
  color: var(--text-muted);
  opacity: 0.5;
}
.sound-btn .card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.sound-btn .img-editor {
  font-size: 0.5em;
  color: #fff;
  opacity: 0.6;
  white-space: nowrap;
  max-width: 64px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sound-btn .card-info {
  flex: 1;
  min-width: 0;
  text-align: left;
}
.sound-btn .id {
  color: var(--text-dim);
  font-size: 0.65em;
  display: block;
  margin-bottom: 2px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: color 0.2s;
  text-align: left;
}
.sound-btn.playing .id { color: var(--accent); }
.sound-btn .label {
  font-size: 1em;
  line-height: 1.4;
  display: block;
  word-break: break-word;
  padding: 2px 0;
  color: var(--text);
  font-weight: 600;
  text-align: left;
}
.sound-btn .label.empty {
  color: var(--text-muted);
  font-style: italic;
  font-size: 0.7em;
  font-weight: 400;
}
.sound-btn .size {
  font-size: 0.55em;
  color: var(--text-muted);
  display: block;
  margin-top: 3px;
  text-align: left;
}
.sound-btn .editor {
  display: block;
  font-size: 0.6em;
  color: #fff;
  margin-top: 1px;
  opacity: 0.8;
  text-align: left;
}

/* CARD LAYOUT */
.ci-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.ci-name {
  display: flex;
  align-items: center;
  gap: 4px;
}
.ci-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}
.edit-inline {
  background: none;
  border: none;
  color: #6366f1;
  cursor: pointer;
  font-size: 1em;
  padding: 6px 8px;
  border-radius: 6px;
  transition: all 0.2s;
  flex-shrink: 0;
  line-height: 1;
}
.edit-inline:hover {
  background: var(--accent-bg);
  color: #818cf8;
}
.play-btn {
  background: #059669;
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 0.85em;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(5,150,105,0.3);
}
.play-btn:hover {
  background: #10b981;
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(5,150,105,0.4);
}
.play-btn i {
  margin-left: 2px;
}
.dl-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: #10b981;
  cursor: pointer;
  font-size: 0.8em;
  padding: 6px 12px;
  border-radius: 8px;
  transition: all 0.2s;
}
.dl-btn:hover {
  background: rgba(16,185,129,0.1);
  border-color: #10b981;
  color: #34d399;
}

/* NO RESULTS */
.no-results {
  text-align: center;
  padding: 60px 40px;
  color: var(--text-muted);
  font-size: 0.95em;
  grid-column: 1 / -1;
}
.no-results i { font-size: 2em; display: block; margin-bottom: 12px; color: var(--border); }

/* FOOTER */
footer {
  text-align: center;
  padding: 14px 20px;
  color: var(--text-muted);
  font-size: 0.8em;
  border-top: 1px solid var(--border);
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg2);
  z-index: 99;
  transition: background 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
footer a { color: var(--accent); text-decoration: none; font-weight: 600; transition: color 0.2s; }
footer a:hover { color: var(--accent-light); }
footer .footer-links {
  display: flex;
  align-items: center;
  gap: 10px;
}
footer .footer-links a {
  font-size: 1.1em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
footer .footer-links a:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
footer .footer-links .fa-instagram { color: #e4405f; }
footer .footer-links .fa-twitch { color: #9146ff; }
footer .footer-links .fa-whatsapp { color: #25d366; }

/* BACK TO TOP */
.back-top {
  position: fixed;
  bottom: 56px;
  right: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 1em;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  z-index: 99;
  box-shadow: 0 2px 8px var(--shadow);
}
.back-top.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.back-top:hover {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 4px 16px var(--shadow-hover);
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: all 0.25s;
}
.modal-overlay.open {
  opacity: 1;
  visibility: visible;
}
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 0;
  width: 95vw;
  height: 95vh;
  max-width: 1600px;
  max-height: 1000px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  transform: scale(0.95);
  transition: transform 0.25s;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-overlay.open .modal-box {
  transform: scale(1);
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 {
  font-size: 1em;
  color: var(--text);
}
.modal-header button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.2em;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.2s;
}
.modal-header button:hover {
  background: var(--bg3);
  color: var(--text);
}
.modal-body {
  display: flex;
  flex: 1;
  min-height: 0;
}
.modal-side {
  width: 260px;
  flex-shrink: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
}
.modal-side p {
  font-size: 0.85em;
  color: var(--text-dim);
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.modal-side input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg3);
  color: var(--text);
  font-size: 0.85em;
  outline: none;
  transition: border-color 0.2s;
}
.modal-side input:focus {
  border-color: var(--accent);
}
.modal-side .modal-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.modal-side .modal-actions button {
  flex: 1;
  padding: 11px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-size: 0.85em;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  min-width: 80px;
}
.modal-side .modal-actions button:hover {
  border-color: var(--accent);
}
.modal-side .modal-actions .btn-primary {
  background: #059669;
  color: #fff;
  border-color: #059669;
}
.modal-side .modal-actions .btn-primary:hover:not(:disabled) {
  opacity: 0.9;
  background: #10b981;
  border-color: #10b981;
}
.modal-side .modal-actions .btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.modal-side .modal-actions .btn-link {
  color: var(--accent);
  border-color: var(--accent);
}
.modal-side .btn-wiki {
  flex: 1;
  padding: 11px 16px;
  border-radius: 10px;
  border: 1px solid #f59e0b;
  background: rgba(245,158,11,0.1);
  color: #f59e0b;
  font-size: 0.85em;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  min-width: 80px;
}
.modal-side .btn-wiki:hover {
  background: rgba(245,158,11,0.2);
}

/* HEARTS ANIMATION */
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
@keyframes heartFall {
  0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(calc(100vh)) rotate(360deg) scale(0.3); opacity: 0; }
}
.heart-particle {
  position: absolute;
  top: -30px;
  font-size: 16px;
  color: #ff6b6b;
  pointer-events: none;
  animation: heartFall linear forwards;
  z-index: 0;
}
@media (max-width: 768px) {
  .modal-body { flex-direction: column; }
  .modal-side { width: 100%; padding: 14px; }
}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <h1>Tibia <span>Soundboard</span></h1>
    <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Alternar tema">
      <span class="active" data-theme-val="light"><i class="fas fa-sun"></i></span>
      <span data-theme-val="dark"><i class="fas fa-moon"></i></span>
    </div>
    <button class="auth-btn" id="authBtn" onclick="handleAuth()">
      <i class="fab fa-google"></i> Entrar
    </button>
  </div>
  <p>815 sons &middot; clique para ouvir &middot; <span id="editHint">lapis para renomear (faça login)</span></p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar por ID (#1), nome ou hash..." oninput="filterSounds()">
    <select id="sortSelect" onchange="filterSounds()">
      <option value="id">Ordem original</option>
      <option value="name">Ordem alfabetica</option>
      <option value="size">Por tamanho</option>
      <option value="edited">Editados</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="sound-grid" id="soundGrid"></div>
</main>
<footer>Criado por <a href="https://www.instagram.com/darcioantonio" target="_blank" rel="noopener">Darcio</a>
  <span class="footer-links">
    <a href="https://www.instagram.com/darcioantonio" target="_blank" rel="noopener" title="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="https://www.twitch.tv/darcio_" target="_blank" rel="noopener" title="Twitch"><i class="fab fa-twitch"></i></a>
    <a href="https://wa.me/5514988035885" target="_blank" rel="noopener" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    <a href="javascript:void(0)" onclick="openDonateModal()" title="Donate" style="color:#ff6b6b"><i class="fas fa-heart"></i></a>
  </span>
</footer>
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Voltar ao topo"><i class="fas fa-chevron-up"></i></button>

<!-- MODAL -->
<div class="modal-overlay" id="mainModal" onclick="">
  <div class="modal-box" id="modalBox" style="max-width:560px;width:92%;height:auto">
    <div class="modal-header">
      <h3 id="modalTitle">Editar Som</h3>
      <button onclick="closeModal()" title="Fechar" style="color:#ef4444"><i class="fas fa-times"></i></button>
    </div>
    <div style="display:flex;gap:20px;padding:20px">
      <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:140px">
        <div id="modalImagePreview" onclick="openWikiForImage()" style="width:120px;height:120px;border-radius:12px;background:var(--bg3);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;transition:all 0.2s;overflow:hidden" onmouseover="this.style.borderColor='#f97316'" onmouseout="this.style.borderColor='var(--border)'">
          <i class="fas fa-plus" style="font-size:1.5em;color:var(--text-muted);opacity:0.5"></i>

var syncTimer = null;
function syncToSupabase() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(function() {
    var payload = [];
    var userName = currentUser ? (currentUser.user_metadata?.full_name || currentUser.email || 'Alguem') : 'Alguem';
    for (var id in customNames) {
      if (id.toString().indexOf('_by') !== -1) continue;
      var img = customImages[id] || null;
      var imgBy = customImages[id + '_by'] || null;
      payload.push({ sound_id: parseInt(id), name: customNames[id], updated_by: userName, image_url: img, image_updated_by: imgBy });
    }
    if (payload.length === 0 || !sb) return;
    sb.from('sound_names').upsert(payload, { onConflict: 'sound_id' }).then(function(resp) {
      if (resp.error) {
        console.error('Supabase sync error:', resp.error.message);
        if (resp.error.message && resp.error.message.indexOf('relation') !== -1) {
          alert('ERRO: Tabela "sound_names" nao existe no Supabase!\n\nVá em: https://supabase.com/dashboard/project/nisiwytknqyrstjsfxah/sql/new\nE cole o SQL:\n\nCREATE TABLE sound_names (sound_id INTEGER PRIMARY KEY, name TEXT NOT NULL, updated_by TEXT, image_url TEXT, image_updated_by TEXT);\nALTER TABLE sound_names ENABLE ROW LEVEL SECURITY;\nCREATE POLICY "ler anon" ON sound_names FOR SELECT USING (true);\nCREATE POLICY "inserir logado" ON sound_names FOR INSERT WITH CHECK (auth.role() = \'authenticated\');\nCREATE POLICY "atualizar logado" ON sound_names FOR UPDATE USING (auth.role() = \'authenticated\');\nCREATE POLICY "deletar logado" ON sound_names FOR DELETE USING (auth.role() = \'authenticated\');');
        }
      }
    });
  }, 500);
}

async function loadFromSupabase() {
  if (!sbConnected || !sb) return;
  var resp = await sb.from('sound_names').select('sound_id,name,updated_by,image_url,image_updated_by');
  if (resp.error) {
      if (resp.error.message && resp.error.message.indexOf('relation') !== -1) {
        var sql = 'CREATE TABLE sound_names (sound_id INTEGER PRIMARY KEY, name TEXT NOT NULL, updated_by TEXT, image_url TEXT, image_updated_by TEXT);\nALTER TABLE sound_names ENABLE ROW LEVEL SECURITY;\nCREATE POLICY "ler anon" ON sound_names FOR SELECT USING (true);\nCREATE POLICY "inserir logado" ON sound_names FOR INSERT WITH CHECK (auth.role() = \'authenticated\');\nCREATE POLICY "atualizar logado" ON sound_names FOR UPDATE USING (auth.role() = \'authenticated\');\nCREATE POLICY "deletar logado" ON sound_names FOR DELETE USING (auth.role() = \'authenticated\');';
        console.warn('SQL para criar tabela:\n' + sql);
        alert('Banco de dados nao configurado!\n\nClique em OK e veja o video:\nhttps://youtu.be/FcE1DlPNJqI\n\nOu cole no SQL Editor do Supabase:\n' + sql);
      }
    return;
  }
  if (resp.data && resp.data.length > 0) {
    resp.data.forEach(function(row) {
      if (row.name) {
        customNames[row.sound_id] = row.name;
        if (row.updated_by) customNames[row.sound_id + '_by'] = row.updated_by;
      }
      if (row.image_url) {
        customImages[row.sound_id] = row.image_url;
        if (row.image_updated_by) customImages[row.sound_id + '_by'] = row.image_updated_by;
      }
    });
    try { localStorage.setItem('tibiaSoundNames', JSON.stringify(customNames)); } catch(e) {}
    try { localStorage.setItem('tibiaSoundImages', JSON.stringify(customImages)); } catch(e) {}
    filterSounds();
  }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function getHash(f) { return f.replace('sound-', '').replace('.ogg', ''); }

function playSound(sound, btn) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if (currentBtn) currentBtn.classList.remove('playing');
  }
  if (currentBtn === btn && currentAudio) {
    currentAudio = null; currentBtn = null; return;
  }
  var audio = new Audio(soundDir + sound.file);
  audio.play().catch(function(){});
  audio.addEventListener('ended', function() {
    btn.classList.remove('playing');
    if (currentAudio === audio) { currentAudio = null; currentBtn = null; }
  });
  currentAudio = audio;
  currentBtn = btn;
  btn.classList.add('playing');
}

function stopAll() {
  if (currentAudio) {
    currentAudio.pause(); currentAudio.currentTime = 0;
    if (currentBtn) currentBtn.classList.remove('playing');
    currentAudio = null; currentBtn = null;
  }
}

function downloadSound(sound, event) {
  event.stopPropagation();
  var name = (customNames[sound.id] || 'tibia-sound-' + sound.id) + '.ogg';
  fetch(soundDir + sound.file).then(function(r) { return r.blob(); }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  });
}

function filterSounds() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var sort = document.getElementById('sortSelect').value;
  var grid = document.getElementById('soundGrid');

  var filtered = sounds.filter(function(s) {
    if (!q) return true;
    if (q.startsWith('#')) {
      var num = parseInt(q.slice(1));
      if (!isNaN(num)) return s.id === num;
    }
    var label = (customNames[s.id] || '').toLowerCase();
    return s.id.toString().indexOf(q) !== -1 ||
           label.indexOf(q) !== -1 ||
           getHash(s.file).toLowerCase().indexOf(q) !== -1;
  });

  if (sort === 'id') filtered.sort(function(a, b) { return a.id - b.id; });
  else if (sort === 'name') {
    filtered.sort(function(a, b) {
      var na = (customNames[a.id] || getHash(a.file)).toLowerCase();
      var nb = (customNames[b.id] || getHash(b.file)).toLowerCase();
      return na.localeCompare(nb);
    });
  }
  else if (sort === 'size') filtered.sort(function(a, b) { return a.size - b.size; });
  else if (sort === 'edited') {
    filtered.sort(function(a, b) {
      var editedA = !!(customNames[a.id] && customNames[a.id].trim()) || !!(customImages[a.id]);
      var editedB = !!(customNames[b.id] && customNames[b.id].trim()) || !!(customImages[b.id]);
      if (editedA && !editedB) return -1;
      if (!editedA && editedB) return 1;
      if (editedA && editedB) {
        var nameA = (customNames[a.id] || '').toLowerCase();
        var nameB = (customNames[b.id] || '').toLowerCase();
        if (nameA && nameB) return nameA.localeCompare(nameB);
        if (nameA && !nameB) return -1;
        if (!nameA && nameB) return 1;
        return a.id - b.id;
      }
      return a.id - b.id;
    });
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">Nenhum som encontrado</div>';
    document.getElementById('stats').textContent = '0 de ' + sounds.length + ' sons';
    return;
  }

  grid.innerHTML = filtered.map(function(s) {
    var label = getLabel(s);
    var h = getHash(s.file);
    var labelClass = label ? '' : 'empty';
    var displayLabel = label || '(sem nome)';
    var editor = customNames[s.id + '_by'] || '';
    var editorHtml = editor ? '<span class="editor">por ' + editor + '</span>' : '';
    var imgUrl = customImages[s.id] || '';
    var imgEditor = customImages[s.id + '_by'] || '';
    var imgHtml = '<div class="card-img' + (imgUrl ? '' : ' card-img-empty') + '" onclick="setImage(' + s.id + ', event)">';
    if (imgUrl) {
      imgHtml += '<img src="' + imgUrl + '" alt="" loading="lazy" onerror="this.parentElement.className=\'card-img card-img-empty\'">';
    }
    imgHtml += '</div>';
    var imgEditorHtml = imgEditor ? '<span class="img-editor">por ' + imgEditor + '</span>' : '';
    return '<div class="sound-btn" onclick="playSound(sounds[' + (s.id - 1) + '], this)" title="Som #' + s.id + '\nHash: ' + h + '\nTamanho: ' + formatSize(s.size) + (label ? '\nNome: ' + label : '') + '">' +
      '<div class="card-body">' +
      '<div class="card-left">' +
      imgHtml +
      imgEditorHtml +
      '</div>' +
      '<div class="card-info">' +
      '<div class="ci-top">' +
      '<span class="id">#' + s.id + '</span>' +
      '<button class="play-btn" onclick="event.stopPropagation();playSound(sounds[' + (s.id - 1) + '], this.parentElement.parentElement.parentElement.parentElement)" title="Tocar som"><i class="fas fa-play"></i></button>' +
      '</div>' +
      '<div class="ci-name">' +
      '<button class="edit-inline" onclick="editName(' + s.id + ', event)" title="Renomear"><i class="fas fa-pen"></i></button>' +
      '<span class="label ' + labelClass + '">' + displayLabel + '</span>' +
      '</div>' +
      editorHtml +
      '<div class="ci-bottom">' +
      '<span class="size">' + formatSize(s.size) + '</span>' +
      '<button class="dl-btn" onclick="downloadSound(sounds[' + (s.id - 1) + '], event)" title="Download"><i class="fas fa-download"></i></button>' +
      '</div>' +
      '</div></div></div>';
  }).join('');

  document.getElementById('stats').textContent = filtered.length + ' de ' + sounds.length + ' sons';
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme') || 'light';
  var next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelectorAll('#themeToggle span').forEach(function(s) {
    s.classList.toggle('active', s.getAttribute('data-theme-val') === next);
  });
}
(function() {
  var saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.querySelectorAll('#themeToggle span').forEach(function(s) {
    s.classList.toggle('active', s.getAttribute('data-theme-val') === saved);
  });
})();

window.addEventListener('scroll', function() {
  document.getElementById('backTop').classList.toggle('show', window.scrollY > 300);
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); stopHearts(); closeDonateModal(); closePixFull(); }
});
if (sbConnected) loadFromSupabase();
filterSounds();
</script>
